name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Darribni secret + private ID scan
        run: python3 scripts/check_secrets.py --all

      - name: Validate workflow JSON
        run: for f in workflows/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done

      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
